<svg width="240" height="80" viewBox="0 0 240 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logo-emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#10B981" />
      <stop offset="100%" stopColor="#059669" />
    </linearGradient>
    <linearGradient id="logo-ochre-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FBBF24" />
      <stop offset="100%" stopColor="#D97706" />
    </linearGradient>
  </defs>

  <!-- Sovereign Monogram Shield -->
  <g transform="translate(10, 10)">
    <polygon points="9,0 51,0 60,9 60,51 51,60 9,60 0,51 0,9" fill="#0E1418" stroke="#222C35" stroke-width="1.5" />
    <polygon points="12,4 48,4 56,12 56,48 48,56 12,56 4,48 4,12" fill="none" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" stroke-dasharray="3 2" />
    
    <!-- F Arm in Emerald -->
    <path d="M16 14 H44 V21 H26 V26 H40 V33 H26 V46 H16 V14 Z" fill="url(#logo-emerald-grad)" />
    <!-- G Arm in Ochre -->
    <path d="M44 28 H34 V35 H37 V38 H27 V45 H44 V28 Z" fill="url(#logo-ochre-grad)" />
    <!-- Diamond Window -->
    <polygon points="30,25 35,30 30,35 25,30" fill="#080C0E" stroke="#10B981" stroke-width="1.5" />
    <circle cx="30" cy="30" r="1.5" fill="#FBBF24" />
  </g>

  <!-- Typographic Wordmark -->
  <text x="82" y="38" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" fill="#F1F5F9" letter-spacing="-0.5">GREAT<tspan fill="#10B981">FINANCE</tspan></text>
  <text x="83" y="54" font-family="monospace" font-weight="700" font-size="7.5" fill="#94A3B8" letter-spacing="2">VERIFIED BALANCED LEDGER</text>
</svg>
